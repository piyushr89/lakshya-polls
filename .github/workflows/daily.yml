name: Lakshya JEE 2027 — Daily Automation

on:
  schedule:
    - cron: '7 2 * * *'        # ~7:37 AM IST  → motivation
    - cron: '13 7 * * 1-5'     # ~12:43 PM IST → quiz
    - cron: '22 9 * * 1,3,5'   # ~2:52 PM IST  → college photo
    - cron: '38 11 * * *'      # ~5:08 PM IST  → checkin
    - cron: '47 16 * * 1-5'    # ~10:17 PM IST → solutions

  workflow_dispatch:
    inputs:
      mode:
        description: 'Which mode to run manually'
        required: true
        default: 'motivation'
        type: choice
        options:
          - motivation
          - quiz
          - college
          - checkin
          - solution

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests pillow google-api-python-client google-auth

      - name: Get today's date
        id: date
        run: echo "today=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Detect run mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            SCHEDULE="${{ github.event.schedule }}"
            case "$SCHEDULE" in
              "7 2 * * *")      echo "MODE=motivation" >> $GITHUB_ENV ;;
              "13 7 * * 1-5")   echo "MODE=quiz"       >> $GITHUB_ENV ;;
              "22 9 * * 1,3,5") echo "MODE=college"    >> $GITHUB_ENV ;;
              "38 11 * * *")    echo "MODE=checkin"    >> $GITHUB_ENV ;;
              "47 16 * * 1-5")  echo "MODE=solution"   >> $GITHUB_ENV ;;
              *)                echo "MODE=motivation" >> $GITHUB_ENV ;;
            esac
          fi
          echo "MODE=$MODE"

      # ── Restore today's questions from cache (solution mode) ─────────────
      - name: Restore questions cache
        if: env.MODE == 'solution'
        uses: actions/cache/restore@v4
        with:
          path: todays_questions.json
          key: questions-${{ steps.date.outputs.today }}
          fail-on-cache-miss: false

      - name: Run automation
        env:
          PW_TOKEN:         ${{ secrets.PW_TOKEN }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL:      ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD:    ${{ secrets.GMAIL_APP_PWD }}
          GDRIVE_SA_JSON:   ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "Running in mode: $MODE"
          ls -la todays_questions.json 2>/dev/null || echo "No questions file yet"
          python send_polls.py --mode=$MODE || true

      # ── Save today's questions to cache (quiz mode) ──────────────────────
      - name: Save questions to cache
        if: always() && env.MODE == 'quiz'
        uses: actions/cache/save@v4
        with:
          path: todays_questions.json
          key: questions-${{ steps.date.outputs.today }}
